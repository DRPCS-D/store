<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DRPCS Store</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#f8f9ff',
            'surface-container-lowest': '#ffffff',
            'surface-container-low': '#eff4ff',
            'surface-container': '#e5eeff',
            'surface-container-high': '#dce9ff',
            'on-surface': '#0b1c30',
            'on-surface-variant': '#434655',
            outline: '#737686',
            'outline-variant': '#c3c6d7',
            primary: '#004ac6',
            'primary-container': '#2563eb',
            'on-primary': '#ffffff',
            'primary-fixed': '#dbe1ff',
            'on-primary-fixed': '#00174b',
            'on-primary-fixed-variant': '#003ea8',
            secondary: '#4b41e1',
            'secondary-container': '#645efb'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Roboto', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-surface font-sans text-on-surface antialiased min-h-screen">
  <header class="sticky top-0 z-50 bg-surface/85 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)]">
    <div class="max-w-6xl mx-auto h-16 px-4 md:px-6 flex items-center gap-4">
      <div class="flex items-center gap-2 flex-shrink-0">
        <span class="material-symbols-outlined text-primary text-[28px]">apps</span>
        <div class="flex flex-col leading-none">
          <span class="font-extrabold text-lg tracking-tight text-primary">DRPCS Store</span>
          <span class="text-[11px] text-on-surface-variant">Mis apps</span>
        </div>
      </div>
      <div class="flex-1 max-w-md ml-auto">
        <div class="relative flex items-center w-full bg-surface-container-low rounded-full px-4 py-2.5 shadow-sm transition-all focus-within:bg-surface-container-lowest focus-within:shadow-md">
          <span class="material-symbols-outlined text-outline text-[20px] mr-2 select-none">search</span>
          <input id="search" type="search" placeholder="Buscar apps..." class="w-full bg-transparent border-none outline-none text-sm text-on-surface placeholder:text-outline" />
        </div>
      </div>
    </div>
    <nav class="max-w-6xl mx-auto px-4 md:px-6 pb-3 flex items-center gap-2 overflow-x-auto" id="categories"></nav>
  </header>

  <main class="max-w-6xl mx-auto px-4 md:px-6 py-8">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="grid">
      <div class="loading col-span-full text-center text-on-surface-variant py-16">Cargando apps...</div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
