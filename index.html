<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>DRPCS Store — Panel de Aplicaciones</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<header>
  <div class="logo">DRPCS <span>STORE</span></div>
  <div class="header-right">
    <a href="javascript:location.reload()" class="btn-refresh">↻ ACTUALIZAR</a>
    <div class="header-tag">PANEL DE APLICACIONES</div>
  </div>
</header>

<main>
  <div class="section-header">
    <div class="section-label">▶ ACCESO RÁPIDO</div>
    <h1 class="section-title"><em>App</em>Store</h1>
    <p class="section-subtitle" id="section-subtitle">Cargando aplicaciones...</p>
  </div>

  <div class="filter-bar">
    <div class="search-wrap">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="BUSCAR APLICACIÓN..." autocomplete="off"/>
    </div>
    <div class="count-badge">
      <strong id="visible-count">0</strong> / <span id="total-count">0</span> APLICACIONES
    </div>
  </div>

  <div id="tools-grid">
    <div class="status-msg">CARGANDO<em>Conectando con Google Sheets</em></div>
  </div>

  <div class="info-bar">
    <strong>© DRPCS Store</strong> Acceso rápido a las aplicaciones internas de la empresa.
  </div>
</main>

<footer>
  <span>DRPCS Store © <span id="footer-year"></span></span>
  <div class="dot"></div>
  <span>GitHub Pages</span>
  <div class="dot"></div>
  <span id="footer-updated"></span>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
